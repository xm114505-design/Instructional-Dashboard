<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>課堂儀表板</title>
<style>
:root{--bg:#F4F6F2;--ink:#2F4550;--mut:#68808A;--acc:#4F7A69;--line:#D9E0DA;--soft:#E9EFEA}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.center{min-height:100%;display:grid;place-items:center;padding:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 24px}
.card+.card,.card+h3{margin-top:14px}
.muted{color:var(--mut)}
small{color:var(--mut);font-size:.8rem}
#app{display:flex;height:100%}
#side{width:250px;flex:none;padding:14px;overflow:auto;background:var(--soft);border-right:1px solid var(--line);transition:width .2s}
.cls{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 14px;display:grid;margin-bottom:14px}
.cls b{font-size:1.3rem}
nav{display:grid;gap:8px}
nav button{min-height:54px;text-align:left;padding:0 14px;background:#fff;border:1px solid var(--line);border-radius:14px;font-weight:700;display:flex;gap:10px;align-items:center}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.fold #side{width:80px}
.fold .cls,.fold nav .t{display:none}
main{flex:1;min-width:0;overflow:auto;padding:12px 22px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#clock{font-weight:700;font-size:1.2rem}
.chip,.btn{min-height:46px;padding:0 16px;background:#fff;border:1px solid var(--line);border-bottom-width:3px;border-radius:14px;font-weight:700}
.chip.on,.btn.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:disabled{opacity:.4}
.chip:active,.btn:active,.seat:active,nav button:active{transform:translateY(2px)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;margin:8px 0;border:1px solid var(--line);border-radius:14px;background:#fff}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.seat{min-height:78px;background:#fff;border:1px solid var(--line);border-bottom-width:3px;border-radius:14px;font-size:1.4rem;font-weight:700;display:grid;place-items:center;padding:4px}
.seat small{font-size:.8rem;font-weight:400}
.seat b{color:var(--acc);font-size:1rem}
.seat.sel{background:var(--acc);border-color:var(--acc);color:#fff}
.seat.sel b,.seat.sel small{color:#fff}
.seat.st0{background:#fff;color:#2F4550}.seat.st1{background:#EADFC9;color:#5C4B2E}.seat.st2{background:#F1D6DD;color:#7A3A4A}.seat.st3{background:#D9E3E7;color:#2F4550}.seat.st4{background:#D3E6DE;color:#2F5E4E}
.seat[class*=" st"] b,.seat[class*=" st"] small{color:inherit}
.brd{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 14px;margin:8px 0}
.k-chinese{background:#E4ECDD;color:#3F5230;border-color:transparent}.k-math{background:#F1D6DD;color:#7A3A4A;border-color:transparent}.k-order{background:#D9E3E7;color:#2F4550;border-color:transparent}
.chip.k-chinese.on{background:#E4ECDD;color:#3F5230;border:3px solid #7F9A62}
.chip.k-math.on{background:#F1D6DD;color:#7A3A4A;border:3px solid #C98796}
.chip.k-order.on{background:#D9E3E7;color:#2F4550;border:3px solid #6F8F9B}
textarea,input{font:inherit;width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff}
textarea{min-height:240px}textarea.s{min-height:84px}
:focus-visible{outline:3px solid #9FAF83;outline-offset:2px}
table.wk{width:100%;border-collapse:collapse;table-layout:fixed;background:#fff;min-width:760px}
table.wk th,table.wk td{border:1px solid var(--line);padding:4px;vertical-align:top}
table.wk th{background:var(--soft);width:12%;font-size:1rem}
table.wk tr.today th{background:#F1D6DD}
table.wk textarea{border:0;min-height:96px;padding:6px}
.wrap{overflow:auto}
.bclk{text-align:center;line-height:1.1;margin:0 0 10px}
.bclk b{display:block;font-size:5.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.bclk small{font-size:1.4rem;color:var(--ink)}
.projw{display:flex;flex-direction:column;align-items:center;position:relative;background:#fff;color:#000;height:calc(100vh - 90px);padding:1vh 3vw;border-radius:18px;}
.projw.ov{position:fixed;inset:0;z-index:9;height:auto;border-radius:0}
.pclk{font-size:9vw;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.pdate{font-size:2.6vw;margin:.4vh 0 1.6vh}
.pbox{display:grid;grid-template-columns:4fr 6fr;gap:3vw;width:100%;flex:1;min-height:0}
.pbox section{border:3px solid #000;border-radius:22px;padding:1.5vh 2.5vw;overflow:auto;background:#fff}
.pbox h2{margin:0 0 1vh;font-size:3.4vw;font-weight:700}
.pbox div{font-size:3vw;line-height:1.7;white-space:pre-wrap}
.pc{position:absolute;top:10px;right:12px;min-height:36px;padding:0 12px;border:1px solid #ccc;background:#fff;border-radius:10px;opacity:.55;color:#333;font-family:system-ui,sans-serif}
.ft{position:absolute;width:430px;background:#fff;border:2px solid #476570;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:10;font:14px system-ui,sans-serif}
.fh{display:flex;gap:4px;padding:6px;background:#476570;border-radius:11px 11px 0 0;cursor:move}
.fh input{flex:1;min-width:0;padding:4px 10px;border-radius:8px;font-size:20px}
.fh button{min-height:40px;padding:0 12px;font-size:18px;border-radius:8px;border:0;background:#fff}
.fg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:8px}
.fg button{min-height:48px;border:1px solid #bbb;background:#fff;border-radius:8px;font-size:20px;font-weight:700}
.fg button.d{color:transparent;background:#eee;border-color:#eee}
.ctabs{display:grid;gap:14px}.ctabs.n1{grid-template-columns:1fr}.ctabs.n2,.ctabs.n3,.ctabs.n4{grid-template-columns:1fr 1fr}
.ct{background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.cth{display:flex;gap:6px;padding:8px;background:var(--h);color:var(--t)}
.cth input{flex:1;min-width:0;background:transparent;border:0;color:var(--t);font-weight:700;font-size:1.3rem;padding:2px 6px}
.cth button{min-height:34px;padding:0 10px;border:0;border-radius:8px;background:rgba(255,255,255,.7);font-size:.8rem}
.cg{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:8px}
.cg button{min-height:54px;border:0;background:var(--c);color:var(--t);border-radius:8px;font-size:1.4rem;font-weight:700}
.n1 .cg button{min-height:96px;font-size:2.6rem}
.cg button.gone{color:transparent;background:#fff;border:1.5px dashed var(--line)}

.chip[class*="k-"]{min-height:60px;font-size:1.5rem;padding:0 28px}
#view[data-sj=chinese] .seat.sel,#view[data-sj=chinese] .btn.on{background:#3E8E5A;border-color:#3E8E5A;color:#fff}
#view[data-sj=math] .seat.sel,#view[data-sj=math] .btn.on{background:#C94C4C;border-color:#C94C4C;color:#fff}
#view[data-sj=order] .seat.sel,#view[data-sj=order] .btn.on{background:#3B6FB6;border-color:#3B6FB6;color:#fff}

.pbox div[contenteditable]{min-height:70%;outline:none}
.pbox div[contenteditable]:focus{background:#F4F6F2;border-radius:10px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:10px 0}
.g2 h2{margin:0;font-size:2.4rem}
.tb{width:100%;border-collapse:collapse;background:#fff}
.tb th,.tb td{border:1px solid var(--line);padding:4px 8px;text-align:center}
.tb th{background:var(--soft)}
.badge{background:#F1D6DD;color:#7A3A4A;border-radius:999px;padding:2px 12px;font-weight:700}
a.chip{display:inline-flex;align-items:center;text-decoration:none}
pre.brd{white-space:pre-wrap;font:inherit}
.ctabs{height:calc(100vh - 340px)}
.ctabs .ct{display:flex;flex-direction:column}
.ctabs .cg{flex:1;grid-auto-rows:1fr}
.ctabs .cg button{min-height:0;font-size:1.8rem}
.ctabs.n1 .cg button{font-size:3.6rem}
.ctabs.n2 .cg button{font-size:2.8rem}
.ctabs.n1 .cth input,.ctabs.n2 .cth input{font-size:2.2rem}
.ctabs.n1 .cth button,.ctabs.n2 .cth button{min-height:44px;font-size:1rem}
@media print{#side,header,.bar,.chip,.btn,.bclk{display:none!important}}



.cth button.warn{background:#F1D6DD;color:#7A3A4A;font-weight:700}

.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media(max-width:1100px){.cols{grid-template-columns:1fr}}
.side2{display:grid;gap:12px}.side2 .card{margin:0}.side2 label{display:block;font-size:.85rem;color:var(--mut);margin-top:6px}
.hol{font-size:3rem;font-weight:700;color:var(--acc);line-height:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal>b{text-align:center;font-size:.9rem}
.cd{min-height:84px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px;font-size:.8rem}
.cd.td{border:2px solid var(--acc)}
.lv{background:#F1D6DD;color:#7A3A4A;border-radius:6px;padding:1px 6px;margin-top:2px}
em.tag{display:block;font-size:.75rem;font-style:normal;font-weight:400;background:rgba(255,255,255,.7);border-radius:6px;padding:0 6px}
select{font:inherit;padding:8px;border-radius:12px;border:1px solid var(--line);background:#fff}

.pbar{height:14px;background:var(--soft);border-radius:999px;overflow:hidden;flex:1;min-width:160px}.pbar i{display:block;height:100%;background:var(--acc)}
.mit{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:8px 0}
.mit.dn .tt{text-decoration:line-through;opacity:.5}
.ckb{flex:none;width:44px;height:44px;border:2px solid var(--line);border-radius:10px;background:#fff;font-weight:700;font-size:1.3rem;color:var(--acc)}
.tg{border-radius:999px;padding:2px 12px;font-size:.8rem;font-weight:700}
.nt{background:#EADFC9;color:#5C4B2E;border-radius:8px;padding:1px 10px;font-size:.85rem;margin-left:8px}
.brd.warn{background:#EADFC9;border-color:#C4B49E}
.mproj{position:fixed;inset:0;background:#fff;color:#000;z-index:9;padding:3vh 4vw;overflow:auto}
.mtop{display:flex;justify-content:space-between;align-items:center;font-size:2.4vw;font-weight:700;margin-bottom:2vh}
.mtop button{min-height:46px;padding:0 16px;margin-left:8px;border:1px solid #ccc;background:#fff;border-radius:10px;font-size:1.4rem}
.mi{display:flex;gap:2vw;align-items:flex-start;padding:2vh 2vw;border:3px solid #000;border-radius:24px;margin-bottom:2vh;cursor:pointer}
.mi.spot{box-shadow:0 0 0 6px #9FAF83,0 0 30px #9FAF83}
.dim .mi:not(.spot){opacity:.25}
.mck{flex:none;width:1.4em;height:1.4em;border:3px solid #000;border-radius:12px;background:#fff;font-size:inherit;font-weight:700}
.mi.dn .mt{text-decoration:line-through;opacity:.5}
.mi em{font-style:normal;font-size:.5em;padding:2px 14px;border-radius:999px}
.mt{font-weight:700}
.mn{font-size:.6em;background:#EADFC9;border-radius:10px;padding:2px 12px;display:inline-block;margin-top:4px}

#snd{margin-left:8px;min-height:40px}
header{justify-content:flex-start;gap:0}
#clock{margin-left:auto}

.bclk.sm{display:flex;justify-content:center;align-items:baseline;gap:18px;margin:0 0 4px}
.bclk.sm b{font-size:5.6rem;line-height:1}
.bclk.sm small{font-size:1.5rem}
.ft{border-color:#2F5E4E}
.fh{background:#2F5E4E}
.fg button{background:#4F7A69;color:#fff;border:0}
.fg button.d{background:#E9EFEA;color:transparent}

.extitle{margin:4px 0 14px}
.extitle mark{background:#EADFC9;color:#2F4550;font-size:2.2rem;font-weight:700;padding:0 .5em;border-radius:10px}
.exrow{display:grid;grid-template-columns:1.8fr 1fr;gap:20px;margin:18px 0}
@media(max-width:900px){.exrow{grid-template-columns:1fr}}
.exm{position:relative;background:#fff;border:3px solid #2F4550;border-bottom-width:8px;border-radius:26px;padding:28px 24px 18px}
.pill{position:absolute;top:-17px;left:26px;border:2px solid #2F4550;border-radius:999px;padding:0 16px;font-size:.95rem;font-weight:700;color:#2F4550}
.exs{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin:8px 0}
.exn{font-size:5rem;font-weight:700;line-height:1.1}
.exr{font-size:1.8rem;background:#D9E3E7;border:3px solid #2F4550;border-radius:999px;padding:2px 22px}
.exc{font-size:1.6rem;margin:6px 0}
.exc b{font-size:4.2rem;font-variant-numeric:tabular-nums;margin-left:14px}
#exWarn{color:#8A2F2F;font-weight:700;min-height:1.6em}
.exbar{position:relative;height:64px;margin-top:6px}
.trk{position:absolute;left:0;right:0;bottom:0;height:28px;border:3px solid #2F4550;border-radius:999px;background:#E9EFEA;overflow:hidden}
.trk i{display:block;height:100%;width:0;background:var(--acc)}
.chick{position:absolute;bottom:26px;left:0;font-size:2.2rem;line-height:1}
.flag{position:absolute;right:0;bottom:26px;font-size:2rem;line-height:1}
.exlb{display:flex;justify-content:space-between;color:var(--mut);font-size:.95rem}
.exnum{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 12px}
.exnum div{border:3px solid #2F4550;border-radius:20px;text-align:center;padding:6px}
.exnum b{display:block;font-size:3.4rem;line-height:1.1}
.exab{border:3px solid #2F4550;border-radius:20px;padding:12px 16px;font-size:1.4rem;background:#F1D6DD;min-height:140px}
.exrmbox{margin:20px 0}
#exRm{font-size:2.2rem;line-height:1.6;min-height:3em;white-space:pre-wrap;outline:none}
#exRm:empty::before{content:attr(data-ph);color:var(--mut)}
.exchips{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:18px 0 8px}
.exch{border:3px solid #8FA39B;border-radius:20px;padding:8px 14px;background:#fff}
.exch.doing{background:#EADFC9;border-color:#2F4550;border-bottom-width:7px}
.exch.next{border-color:#2F4550}
.exch.done{opacity:.45}
.exh{display:flex;justify-content:space-between;align-items:center}
.exh b{font-size:1.4rem}
.exh span{border:2px solid #8FA39B;border-radius:999px;padding:0 12px;font-size:.9rem;background:#D9E3E7}
.exft{text-align:center;font-size:1.6rem;color:var(--mut);margin:10px 0;min-height:1.6em}
.exset{position:fixed;inset:0;background:rgba(47,69,80,.45);z-index:20;display:grid;place-items:start center;padding:3vh 2vw;overflow:auto}
.exfm{width:min(740px,100%)}
.exfm label{display:block;margin-top:10px;font-weight:700}
.xr{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:8px;align-items:center}

.exbar{height:96px}
.run{position:absolute;left:0;right:46px;bottom:0;height:0}
.chick,.flag{font-size:0;line-height:0}
.chick{bottom:26px}
.flag{bottom:26px}
.chick svg{display:block;animation:hop .7s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

.wgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:10px 6px;margin:10px 0}
.wk{background:transparent;border:3px solid transparent;border-radius:18px;padding:6px 2px;display:grid;justify-items:center;gap:2px;cursor:pointer}
.wk.sel{background:#D3E6DE;border-color:#4F7A69}
.av{position:relative;display:block;width:84px;height:84px}
.av img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.22);background:#fff}
.bd{position:absolute;top:-6px;right:-12px;min-width:38px;height:38px;border-radius:999px;background:#2E8B57;color:#fff;font-size:1rem;display:grid;place-items:center;padding:0 6px;border:2px solid #fff}
.bd.neg{background:#D64545}
.wn{font-weight:700;font-size:1rem}
.dts{display:flex;gap:3px;min-height:22px}
.dt{font-style:normal;font-size:.78rem;font-weight:700;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;border:1.5px solid rgba(0,0,0,.28)}
.wbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.db{min-height:56px;padding:0 18px;border:0;border-bottom:4px solid rgba(0,0,0,.28);border-radius:14px;font-weight:700;font-size:1.1rem}
.db.w{border:2px solid #2F4550;border-bottom-width:4px}
.db:disabled{opacity:.4}
details summary{cursor:pointer;margin:10px 0;font-weight:700}

@media(max-width:1000px){.wgrid{grid-template-columns:repeat(5,1fr)}}

.tb td:nth-child(6){font-size:1.4rem;letter-spacing:2px;white-space:nowrap}

.exfix{margin:20px 0}
.exfh{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.exfwarn{color:#8A2F2F;font-weight:700;font-size:1.5rem}
.fxadd{display:flex;gap:10px;align-items:flex-start;margin:6px 0 12px}
.fxadd textarea{min-height:72px;font-size:1.3rem}
.fxi{position:relative;border:4px solid #C79B2D;border-radius:22px;background:#FFFBEA;padding:14px 20px;margin:12px 0}
.fxn{background:#F2C94C;border:2px solid #2F4550;border-radius:999px;padding:0 14px;font-weight:700;margin-right:10px}
.fxt{color:var(--mut)}
.fxd{position:absolute;top:10px;right:12px;min-height:36px}
.fxx{font-weight:700;line-height:1.35;margin-top:8px;white-space:pre-wrap}
#view[data-pg=exam] .bclk b{font-size:7rem}
#view[data-pg=exam] .exc b{font-size:5rem}
#view[data-pg=exam] .exn{font-size:5.5rem}

</style>

<body>
<div id="login" class="center" hidden>
  <div class="card">
    <h1>課堂儀表板</h1>
    <p id="loginMsg" class="muted">請用老師的 Google 帳號登入。</p>
    <button id="signin" class="btn on">使用 Google 登入</button>
  </div>
</div>
<div id="app" hidden>
  <aside id="side">
    <div class="cls"><small>正在使用</small><b id="clsName"></b><small id="clsInfo"></small></div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <header><button id="fold" class="chip" aria-label="收合工具列">☰</button><span id="clock"></span></header>
    <div id="view"></div>
  </main>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, doc, getDoc, setDoc, updateDoc,
  collection, addDoc, query, where, getDocs, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyAHnreDZMsL8Drlk8KLdRc-bkWB38LHuTc",
  authDomain: "instructional-dashboard.firebaseapp.com",
  projectId: "instructional-dashboard",
  storageBucket: "instructional-dashboard.firebasestorage.app",
  messagingSenderId: "695443531271",
  appId: "1:695443531271:web:98865af19a310f5667eca2"
});
const auth = getAuth(app);
const db = initializeFirestore(app, { localCache: persistentLocalCache() });

const onUser = cb => onAuthStateChanged(auth, cb);
const login = () => signInWithPopup(auth, new GoogleAuthProvider());
const logout = () => signOut(auth);

// 設定與名單（每個學期可再加上 term 欄位區分）
async function getConfig(name, fallback) {
  const s = await getDoc(doc(db, "config", name));
  return s.exists() ? s.data() : fallback;
}
const saveConfig = (name, data) => setDoc(doc(db, "config", name), data);

// 加扣分帳本：只新增、不改分數；復原 = 標記 voided
const addLedger = e => addDoc(collection(db, "ledger"), { ...e, ts: Date.now(), voided: false });
const voidLedger = id => updateDoc(doc(db, "ledger", id), { voided: true });
async function listLedger(date) {
  const snap = await getDocs(query(collection(db, "ledger"), where("date", "==", date)));
  return snap.docs.map(d => ({ id: d.id, ...d.data() }))
    .filter(e => !e.voided).sort((a, b) => b.ts - a.ts);
}

// 各模組資料：沿用舊系統備份的格式，整份存成 JSON 字串（避開 Firestore 巢狀陣列限制）
async function getKV(k, fb) {
  const s = await getDoc(doc(db, "kv", k));
  return s.exists() ? JSON.parse(s.data().json) : fb;
}
const setKV = (k, v) => setDoc(doc(db, "kv", k), { json: JSON.stringify(v), ts: Date.now() });
async function allKV() {
  const o = {};
  (await getDocs(collection(db, "kv"))).docs.forEach(d => o[d.id] = JSON.parse(d.data().json));
  return o;
}

// 即時同步：其他裝置修改資料時通知畫面更新（本機自己的寫入不會觸發）
function watchKV(cb) {
  let first = true;
  return onSnapshot(collection(db, "kv"), snap => {
    if (first) { first = false; return; }
    const ids = snap.docChanges().filter(c => c.type !== "removed" && !c.doc.metadata.hasPendingWrites).map(c => c.doc.id);
    if (ids.length) cb(ids);
  }, () => {});
}

const $ = s => document.querySelector(s);
const ymd = d => d.toLocaleDateString("sv");
const today = () => ymd(new Date());
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ctx = { roster: [], cfg: { className: "六年五班" } };
const seatList = n => ctx.roster.length ? ctx.roster.filter(r => r.status !== "轉出") : Array.from({ length: n || 28 }, (_, i) => ({ seat: i + 1, name: "" }));
const save = (name, obj) => { const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" }));
  a.download = name; a.click(); };

// ---- 週次計算（沿用舊系統：以開學週的週一為第 1 週）----
const monday = s => { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; };
const weekNo = (b, date) => Math.floor((monday(date) - monday(b.settings?.semesterStart || "2026-08-31")) / 6048e5) + 1;
const dow = date => { const g = new Date(date + "T00:00:00").getDay(); return g >= 1 && g <= 5 ? g : 0; };
const stub = (id, icon, title, note) => ({ id, icon, title, summary: async () => null,
  render: el => el.innerHTML = `<h2>${title}</h2><p class="muted">${note}</p>` });
const BOARD0 = { settings: { semesterStart: "2026-08-31" }, events: [], morningTemplates: {}, weeksData: {} };

const home = {
  id: "home", icon: "🏠", title: "首頁", summary: async () => null,
  async render(el) { const p = buildProj(await getKV("board", BOARD0), false); el.append(p); window.__iv = p._iv; }
};
const seatNums = () => seatList().map(r => r.seat);
const DAYS = ["一", "二", "三", "四", "五"];

// ---- 投影頁：乾淨白底 + 可拖曳的小訂正表 ----
function buildProj(b, overlay) {
  const d = dow(today()), day = d ? (b.weeksData?.[weekNo(b, today())]?.[d] || {}) : {};
  const p = document.createElement("div"); p.className = "projw" + (overlay ? " ov" : "");
  p.innerHTML = `<button class="pc" id="pT" style="left:12px;right:auto">＋ 訂正表</button>${overlay ? `<button class="pc" id="pX">✕</button>` : ""}
    <div class="pclk"></div><div class="pdate"></div><div class="pbox">
    <section><h2>早自修任務：</h2><div id="pM" contenteditable="true">${esc(d ? (b.morningOverride?.[today()] ?? b.morningTemplates?.[d]) : "")}</div></section>
    <section><h2>聯絡簿：</h2><div id="pH" contenteditable="true">${esc(day.homework)}</div></section></div>`;
  const clk = () => { const n = new Date();
    p.querySelector(".pclk").textContent = [n.getHours(), n.getMinutes(), n.getSeconds()].map(x => String(x).padStart(2, "0")).join("：");
    p.querySelector(".pdate").textContent = n.toLocaleDateString("zh-TW", { year: "numeric", month: "long", day: "numeric", weekday: "long" }); };
  clk(); const iv = (p._iv = setInterval(clk, 1000));
  p.onclick = e => { if (e.target.id === "pX") { clearInterval(iv); p.remove(); } if (e.target.id === "pT") floatTracker(p, b); };
  p.addEventListener("focusout", async e => { if (!d) return; const v = e.target.innerText.replace(/\n+$/, "");
    if (e.target.id === "pH") { const wk = weekNo(b, today()); ((b.weeksData ||= {})[wk] ||= {})[d] = { ...(b.weeksData[wk][d] || {}), homework: v }; }
    else if (e.target.id === "pM") (b.morningOverride ||= {})[today()] = v;
    else return; await setKV("board", b); });
  return p;
}
const openProj = b => document.body.append(buildProj(b, true));
function bigClock(el, small) {
  const c = document.createElement("div"); c.className = "bclk" + (small ? " sm" : "");
  const t = () => { const n = new Date(), z = x => String(x).padStart(2, "0");
    c.innerHTML = `<b>${z(n.getHours())}:${z(n.getMinutes())}:${z(n.getSeconds())}</b><small>${n.getFullYear()}.${z(n.getMonth() + 1)}.${z(n.getDate())}</small>`; };
  t(); window.__iv = setInterval(t, 1000); el.prepend(c);
}
function floatTracker(p, b) {
  if (p.querySelector(".ft")) return;
  const tr = (b.tracker ||= { title: "消毒", status: {} }); tr.status ||= {};
  const f = document.createElement("div"); f.className = "ft"; f.style.left = "58%"; f.style.top = "38%";
  const draw = () => f.innerHTML = `<div class="fh"><input id="fT" value="${esc(tr.title)}"><button data-r="1" title="全部重設">↺</button><button data-x="1" title="關閉">✕</button></div>
    <div class="fg">${seatNums().map(s => `<button class="${tr.status[s] ? "d" : ""}" data-s="${s}">${s}</button>`).join("")}</div>`;
  draw(); p.append(f);
  f.onpointerdown = e => { if (!e.target.closest(".fh") || e.target.closest("input,button")) return;
    const ox = e.clientX - f.offsetLeft, oy = e.clientY - f.offsetTop; f.setPointerCapture(e.pointerId);
    f.onpointermove = m => { f.style.left = m.clientX - ox + "px"; f.style.top = m.clientY - oy + "px"; };
    f.onpointerup = () => f.onpointermove = null; };
  f.onclick = async e => { const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.x) return f.remove();
    if (t.dataset.r) tr.status = {}; else if (t.dataset.s) tr.status[t.dataset.s] = !tr.status[t.dataset.s]; else return;
    await setKV("board", b); draw(); };
  f.onchange = async e => { if (e.target.id === "fT") { tr.title = e.target.value; await setKV("board", b); } };
}

// ---- 班級黑板：一頁一週，「作業」欄即當天聯絡簿 ----
const board = {
  id: "board", icon: "📋", title: "行事曆", week: null,
  async summary() {
    const b = await getKV("board", BOARD0), d = dow(today());
    return d && !b.weeksData?.[weekNo(b, today())]?.[d]?.homework ? { text: "今日聯絡簿尚未填寫", badge: "待填寫", go: "board" } : null;
  },
  async render(el) {
    const b = await getKV("board", BOARD0), t0 = today(), F = [["chinese", "國語"], ["math", "數學"], ["flex", "彈性"], ["homework", "作業"]];
    this.week = weekNo(b, t0);
    const draw = () => {
      const wk = this.week, w0 = monday(b.settings?.semesterStart || "2026-08-31");
      const lim = ymd(new Date(new Date(t0 + "T00:00:00").getTime() + 28 * 864e5)), evs = (b.events || []).filter(e => e.date >= t0 && e.date <= lim).sort((x, y) => x.date.localeCompare(y.date));
      const hs = b.settings?.holidayStart, hol = hs ? Math.max(0, Math.ceil((new Date(hs + "T00:00:00") - new Date(t0 + "T00:00:00")) / 864e5)) : "—";
      const hwText = [1, 2, 3, 4, 5].map(d => { const dt = new Date(w0); dt.setDate(dt.getDate() + (wk - 1) * 7 + d - 1);
        const ls = String(b.weeksData?.[wk]?.[d]?.homework || "").split("\n").map(x => x.trim()).filter(Boolean);
        const body = !ls.length ? ["1.無作業"] : ls.some(x => /^\d+[.．、]/.test(x)) ? ls : ls.map((x, i) => `${i + 1}.${x}`);
        return `${dt.getFullYear() - 1911}年${dt.getMonth() + 1}月${dt.getDate()}日(${DAYS[d - 1]})\n${body.join("\n")}`; }).join("\n\n");
      const rows = [1, 2, 3, 4, 5].map(d => { const dt = new Date(w0); dt.setDate(dt.getDate() + (wk - 1) * 7 + d - 1);
        const day = b.weeksData?.[wk]?.[d] || {};
        return `<tr class="${ymd(dt) === t0 ? "today" : ""}"><th>${dt.getMonth() + 1}/${dt.getDate()}（${DAYS[d - 1]}）</th>${F.map(([k]) => `<td><textarea data-d="${d}" data-k="${k}">${esc(day[k])}</textarea></td>`).join("")}</tr>`; }).join("");
      el.innerHTML = `<h2>行事曆</h2><div class="bar"><button class="chip" data-w="-1">◀ 上一週</button><b>第 ${wk} 週</b>
        <button class="chip" data-w="1">下一週 ▶</button><button class="chip" data-w="0">本週</button><button class="btn hot" id="bProj">全螢幕投影</button><button class="btn on" id="bExp">匯出當週作業</button></div>
        <div class="cols"><div>${this.exp ? `<div class="card"><h3>第 ${wk} 週作業（可直接複製貼到電子聯絡簿）</h3><textarea id="bExpT" readonly style="min-height:340px">${esc(hwText)}</textarea>
          <p><button class="btn on" id="bCopy">複製全部</button> <span id="bCopyMsg" class="muted"></span></p></div>` : ""}<div class="wrap"><table class="wk"><tr><th></th>${F.map(([, n]) => `<th>${n}</th>`).join("")}</tr>${rows}</table></div>
        <p class="muted">「作業」欄會自動成為當天的聯絡簿，輸入後會自動儲存。 <span id="bMsg"></span></p>
        </div><aside class="side2">
          <div class="card"><h3 style="margin-top:0">重要行事</h3><div class="bar"><input id="eT" placeholder="輸入行事內容"><input id="eD" type="date"><button class="chip" id="eAdd">新增</button></div>
            ${evs.map(e => `<div class="row"><span>${e.date.slice(5)} ${esc(e.title)}</span><button class="chip" data-del="${e.id}">✕</button></div>`).join("") || `<p class="muted">未來 4 週沒有行事。</p>`}</div>
          <div class="card"><h3 style="margin-top:0">假期倒數</h3><div class="hol">${hol}</div><small>DAYS LEFT</small><label>寒暑假起始日<input type="date" data-set="holidayStart" value="${b.settings?.holidayStart || ""}"></label></div>
          <div class="card"><h3 style="margin-top:0">早自修週範本</h3>${DAYS.map((n, i) => `<label>週${n}<input data-m="${i + 1}" value="${esc(b.morningTemplates?.[i + 1])}"></label>`).join("")}</div>
          <div class="card"><h3 style="margin-top:0">學期設定</h3><label>學期起始日（第 1 週）<input type="date" data-set="semesterStart" value="${b.settings?.semesterStart || ""}"></label><label>學期結束日<input type="date" data-set="semesterEnd" value="${b.settings?.semesterEnd || ""}"></label></div>
        </aside></div>`;
    };
    el.onclick = async e => { const t = e.target.closest("button"); if (!t) return;

        this.undo = u; this.msg = `已為 ${sel.length} 位學生 ${+d.v > 0 ? "+" : ""}${d.v} 分`; this.sel = new Set(); if (+d.v > 0) sTick(); await save(); }
      else if (t.id === "wBase") { const u = { pts: {}, dots: [], base: [] }; let skip = 0; sel.forEach(s => { if (W.base[s]) skip++; else { W.base[s] = 1; W.pts[s] = (W.pts[s] || 0) + 5; u.pts[s] = 5; u.base.push(s); } });
        this.undo = u; this.msg = `基本分 +5 已發給 ${sel.length - skip} 位${skip ? `（${skip} 位本週已領過，已略過）` : ""}`; this.sel = new Set(); if (sel.length - skip) cheer(); await save(); }
      else if (t.id === "wUndo") { const u = this.undo; if (!u) this.msg = "沒有可復原的動作"; else { Object.entries(u.pts).forEach(([s, v]) => W.pts[s] = (W.pts[s] || 0) - v); u.dots.forEach(([s, c, n]) => addD(s, c, -n)); u.base.forEach(s => delete W.base[s]); this.undo = null; this.msg = "已復原上一步"; await save(); } }
      else if (d.rd != null || t.id === "rGo") { if (sel.length !== 1) { this.msg = "請先選取一位學生再兌換"; return draw(); }
        const r = d.rd != null ? W.redeem[+d.rd] : { name: $("#rN").value.trim() || "自訂兌換", cost: Math.round(+$("#rC").value) };
        if (!(r.cost > 0)) { this.msg = "請輸入要扣的點數"; return draw(); } const have = W.pts[sel[0]] || 0;
        if (!confirm(`${nm[sel[0]]}：兌換「${r.name}」扣 ${r.cost} 點（目前 ${have} 點）${have < r.cost ? "\n點數不足，仍要兌換嗎？" : ""}`)) return;
        W.pts[sel[0]] = have - r.cost; this.undo = { pts: { [sel[0]]: -r.cost }, dots: [], base: [] }; this.msg = `${nm[sel[0]]} 已兌換「${r.name}」`; this.sel = new Set(); cheer(); await save(); }
      else if (t.id === "zSel") { if (!confirm(`確定將選取的 ${sel.length} 位學生點數歸零？此動作無法復原。`)) return; sel.forEach(s => W.pts[s] = 0); this.undo = null; this.msg = `已將 ${sel.length} 位學生歸零`; this.sel = new Set(); await save(); }
      else if (t.id === "zAll") { if (!confirm("確定將全班點數歸零，並清除本週圓點？此動作無法復原。")) return; W.pts = {}; W.dots = {}; W.base = {}; this.undo = null; this.msg = "全班點數已歸零"; this.sel = new Set(); await save(); }
      else if (t.id === "rEd") this.edit = !this.edit;
      else if (t.id === "rAdd") { W.redeem.push({ name: "新選項", cost: 10 }); await save(); }
      else if (d.rm != null) { W.redeem.splice(+d.rm, 1); await save(); }
      else return;
      draw(); };
    el.onchange = async e => { const d = e.target.dataset; if (d.en != null) W.redeem[+d.en].name = e.target.value; else if (d.ec != null) W.redeem[+d.ec].cost = Math.max(1, Math.round(+e.target.value) || 1); else return; await save(); };
    draw();
  }
};

const MODS = [home, corrections, points, attendance, weekly, memo, exam, board, data, settings];

function fill() { $("#clsName").textContent = ctx.cfg.className; $("#clsInfo").textContent = `${ctx.roster.length} 位學生`; }
let cur = "home", pend = false, unsub = null;
const busy = () => { const e = document.activeElement; return !!e && !!e.matches && e.matches("input,textarea,select,[contenteditable='true']"); };
function refresh() { if (busy() || window.__dirty) { pend = true; setTimeout(() => pend && refresh(), 1500); return; } pend = false; go(cur); }
const onRemote = async keys => { if (hooks.size) { for (const h of hooks) await h(keys); return; }
  if (document.querySelector(".projw.ov, .mproj")) return; refresh(); };
function go(id) { cur = id;
  $("#nav").innerHTML = MODS.map(m => `<button data-go="${m.id}" class="${m.id === id ? "on" : ""}"><span>${m.icon}</span><span class="t">${m.title}</span></button>`).join("");
  clearInterval(window.__iv); clearInterval(window.__iv2); const el = $("#view"); el.onclick = el.onchange = null; el.removeAttribute("data-sj"); el.removeAttribute("data-pg"); el.innerHTML = "";
  Promise.resolve(MODS.find(m => m.id === id).render(el)).catch(err => el.innerHTML = `<div class="card"><h2>這一頁載入失敗</h2><p class="muted">${esc(err.message)}</p></div>`);
}
document.addEventListener("click", e => { const g = e.target.closest("[data-go]"); if (g) go(g.dataset.go); });
$("#fold").onclick = () => $("#app").classList.toggle("fold");
{ const sb = document.createElement("button"); sb.id = "snd"; sb.className = "chip"; const lab = () => sb.textContent = SND ? "🔊 音效開" : "🔇 音效關"; lab(); $("#fold").after(sb);
  sb.onclick = () => { SND = !SND; try { localStorage.setItem("snd", SND ? "1" : "0"); } catch {} lab(); if (SND) sTick(); }; }
$("#signin").onclick = () => login().catch(e => $("#loginMsg").textContent = "登入失敗：" + e.message);
const tick = () => $("#clock").textContent = new Date().toLocaleString("zh-TW", { month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false });
setInterval(tick, 20000); tick();

onUser(async user => {
  $("#login").hidden = !!user; $("#app").hidden = !user; if (!user) { unsub?.(); return; }
  try {
    ctx.cfg = { ...ctx.cfg, ...(await getConfig("main", {})) };
    ctx.roster = (await getConfig("roster", { students: [] })).students;
    fill(); go("home"); unsub?.(); unsub = watchKV(onRemote);
  } catch (e) {
    $("#app").hidden = true; $("#login").hidden = false;
    $("#loginMsg").textContent = "此帳號沒有讀取權限，請確認 Firestore 規則中的 Email。"; logout();
  }
});

</script>
