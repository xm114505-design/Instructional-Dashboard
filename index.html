<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>課堂儀表板</title>
<style>
:root{--bg:#F4F6F2;--ink:#2F4550;--mut:#68808A;--acc:#4F7A69;--line:#D9E0DA;--soft:#E9EFEA}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.center{min-height:100%;display:grid;place-items:center;padding:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 24px}
.card+.card,.card+h3{margin-top:14px}
.muted{color:var(--mut)}
small{color:var(--mut);font-size:.8rem}
#app{display:flex;height:100%}
#side{width:250px;flex:none;padding:14px;overflow:auto;background:var(--soft);border-right:1px solid var(--line);transition:width .2s}
.cls{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 14px;display:grid;margin-bottom:14px}
.cls b{font-size:1.3rem}
nav{display:grid;gap:8px}
nav button{min-height:54px;text-align:left;padding:0 14px;background:#fff;border:1px solid var(--line);border-radius:14px;font-weight:700;display:flex;gap:10px;align-items:center}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.fold #side{width:80px}
.fold .cls,.fold nav .t{display:none}
main{flex:1;min-width:0;overflow:auto;padding:12px 22px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#clock{font-weight:700;font-size:1.2rem}
.chip,.btn{min-height:46px;padding:0 16px;background:#fff;border:1px solid var(--line);border-bottom-width:3px;border-radius:14px;font-weight:700}
.chip.on,.btn.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:disabled{opacity:.4}
.chip:active,.btn:active,.seat:active,nav button:active{transform:translateY(2px)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;margin:8px 0;border:1px solid var(--line);border-radius:14px;background:#fff}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.seat{min-height:78px;background:#fff;border:1px solid var(--line);border-bottom-width:3px;border-radius:14px;font-size:1.4rem;font-weight:700;display:grid;place-items:center;padding:4px}
.seat small{font-size:.8rem;font-weight:400}
.seat b{color:var(--acc);font-size:1rem}
.seat.sel{background:var(--acc);border-color:var(--acc);color:#fff}
.seat.sel b,.seat.sel small{color:#fff}
.seat.st0{background:#FFFDF7;color:#2F4550}.seat.st1{background:#EADFC9;color:#5C4B2E}.seat.st2{background:#F1D6DD;color:#7A3A4A}.seat.st3{background:#D9E3E7;color:#2F4550}.seat.st4{background:#D3E6DE;color:#2F5E4E}
.seat[class*=" st"] b,.seat[class*=" st"] small{color:inherit}
.brd{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 14px;margin:8px 0}
.k-chinese{background:#E4ECDD;color:#3F5230;border-color:transparent}.k-math{background:#F1D6DD;color:#7A3A4A;border-color:transparent}.k-order{background:#D9E3E7;color:#2F4550;border-color:transparent}
.chip.k-chinese.on{background:#E4ECDD;color:#3F5230;border:3px solid #7F9A62}
.chip.k-math.on{background:#F1D6DD;color:#7A3A4A;border:3px solid #C98796}
.chip.k-order.on{background:#D9E3E7;color:#2F4550;border:3px solid #6F8F9B}
textarea,input{font:inherit;width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff}
textarea{min-height:240px}textarea.s{min-height:84px}
:focus-visible{outline:3px solid #9FAF83;outline-offset:2px}
table.wk{width:100%;border-collapse:collapse;table-layout:fixed;background:#fff;min-width:760px}
table.wk th,table.wk td{border:1px solid var(--line);padding:4px;vertical-align:top}
table.wk th{background:var(--soft);width:12%;font-size:1rem}
table.wk tr.today th{background:#F1D6DD}
table.wk textarea{border:0;min-height:96px;padding:6px}
.wrap{overflow:auto}
.bclk{text-align:center;line-height:1.1;margin:0 0 10px}
.bclk b{display:block;font:500 5.5rem Georgia,"Times New Roman",serif}
.bclk small{font-size:1.4rem;color:var(--ink)}
.projw{display:flex;flex-direction:column;align-items:center;position:relative;background:#fff;color:#000;height:calc(100vh - 90px);padding:1vh 3vw;border-radius:18px;font-family:"DFKai-SB","BiauKai","標楷體","KaiTi","Kaiti TC",serif}
.projw.ov{position:fixed;inset:0;z-index:9;height:auto;border-radius:0}
.pclk{font-size:9vw;line-height:1.1}
.pdate{font-size:2.6vw;margin:.4vh 0 1.6vh}
.pbox{display:grid;grid-template-columns:4fr 6fr;gap:3vw;width:100%;flex:1;min-height:0}
.pbox section{border:3px solid #000;border-radius:22px;padding:1.5vh 2.5vw;overflow:auto;background:#fff}
.pbox h2{margin:0 0 1vh;font-size:3.4vw;font-weight:700}
.pbox div{font-size:3vw;line-height:1.7;white-space:pre-wrap}
.pc{position:absolute;top:10px;right:12px;min-height:36px;padding:0 12px;border:1px solid #ccc;background:#fff;border-radius:10px;opacity:.55;color:#333;font-family:system-ui,sans-serif}
.ft{position:absolute;width:430px;background:#fff;border:2px solid #476570;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:10;font:14px system-ui,sans-serif}
.fh{display:flex;gap:4px;padding:6px;background:#476570;border-radius:11px 11px 0 0;cursor:move}
.fh input{flex:1;min-width:0;padding:4px 10px;border-radius:8px;font-size:20px}
.fh button{min-height:40px;padding:0 12px;font-size:18px;border-radius:8px;border:0;background:#fff}
.fg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:8px}
.fg button{min-height:48px;border:1px solid #bbb;background:#fff;border-radius:8px;font-size:20px;font-weight:700}
.fg button.d{color:transparent;background:#eee;border-color:#eee}
.ctabs{display:grid;gap:14px}.ctabs.n1{grid-template-columns:1fr}.ctabs.n2,.ctabs.n3,.ctabs.n4{grid-template-columns:1fr 1fr}
.ct{background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.cth{display:flex;gap:6px;padding:8px;background:var(--h);color:var(--t)}
.cth input{flex:1;min-width:0;background:transparent;border:0;color:var(--t);font-weight:700;font-size:1.3rem;padding:2px 6px}
.cth button{min-height:34px;padding:0 10px;border:0;border-radius:8px;background:rgba(255,255,255,.7);font-size:.8rem}
.cg{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:8px}
.cg button{min-height:54px;border:0;background:var(--c);color:var(--t);border-radius:8px;font-size:1.4rem;font-weight:700}
.n1 .cg button{min-height:96px;font-size:2.6rem}
.cg button.gone{color:transparent;background:#fff;border:1.5px dashed var(--line)}

.chip[class*="k-"]{min-height:60px;font-size:1.5rem;padding:0 28px}
#view[data-sj=chinese] .seat.sel,#view[data-sj=chinese] .btn.on{background:#3E8E5A;border-color:#3E8E5A;color:#fff}
#view[data-sj=math] .seat.sel,#view[data-sj=math] .btn.on{background:#C94C4C;border-color:#C94C4C;color:#fff}
#view[data-sj=order] .seat.sel,#view[data-sj=order] .btn.on{background:#3B6FB6;border-color:#3B6FB6;color:#fff}

</style>
</head>
<body>
<div id="login" class="center" hidden>
  <div class="card">
    <h1>課堂儀表板</h1>
    <p id="loginMsg" class="muted">請用老師的 Google 帳號登入。</p>
    <button id="signin" class="btn on">使用 Google 登入</button>
  </div>
</div>
<div id="app" hidden>
  <aside id="side">
    <div class="cls"><small>正在使用</small><b id="clsName"></b><small id="clsInfo"></small></div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <header><button id="fold" class="chip" aria-label="收合工具列">☰</button><span id="clock"></span></header>
    <div id="view"></div>
  </main>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, doc, getDoc, setDoc, updateDoc,
  collection, addDoc, query, where, getDocs }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyAHnreDZMsL8Drlk8KLdRc-bkWB38LHuTc",
  authDomain: "instructional-dashboard.firebaseapp.com",
  projectId: "instructional-dashboard",
  storageBucket: "instructional-dashboard.firebasestorage.app",
  messagingSenderId: "695443531271",
  appId: "1:695443531271:web:98865af19a310f5667eca2"
});
const auth = getAuth(app);
const db = initializeFirestore(app, { localCache: persistentLocalCache() });

const onUser = cb => onAuthStateChanged(auth, cb);
const login = () => signInWithPopup(auth, new GoogleAuthProvider());
const logout = () => signOut(auth);

// 設定與名單（每個學期可再加上 term 欄位區分）
async function getConfig(name, fallback) {
  const s = await getDoc(doc(db, "config", name));
  return s.exists() ? s.data() : fallback;
}
const saveConfig = (name, data) => setDoc(doc(db, "config", name), data);

// 加扣分帳本：只新增、不改分數；復原 = 標記 voided
const addLedger = e => addDoc(collection(db, "ledger"), { ...e, ts: Date.now(), voided: false });
const voidLedger = id => updateDoc(doc(db, "ledger", id), { voided: true });
async function listLedger(date) {
  const snap = await getDocs(query(collection(db, "ledger"), where("date", "==", date)));
  return snap.docs.map(d => ({ id: d.id, ...d.data() }))
    .filter(e => !e.voided).sort((a, b) => b.ts - a.ts);
}

// 各模組資料：沿用舊系統備份的格式，整份存成 JSON 字串（避開 Firestore 巢狀陣列限制）
async function getKV(k, fb) {
  const s = await getDoc(doc(db, "kv", k));
  return s.exists() ? JSON.parse(s.data().json) : fb;
}
const setKV = (k, v) => setDoc(doc(db, "kv", k), { json: JSON.stringify(v), ts: Date.now() });
async function allKV() {
  const o = {};
  (await getDocs(collection(db, "kv"))).docs.forEach(d => o[d.id] = JSON.parse(d.data().json));
  return o;
}


const $ = s => document.querySelector(s);
const ymd = d => d.toLocaleDateString("sv");
const today = () => ymd(new Date());
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ctx = { roster: [], cfg: { className: "六年五班" } };
const seatList = n => ctx.roster.length ? ctx.roster : Array.from({ length: n || 28 }, (_, i) => ({ seat: i + 1, name: "" }));
const save = (name, obj) => { const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" }));
  a.download = name; a.click(); };

// ---- 週次計算（沿用舊系統：以開學週的週一為第 1 週）----
const monday = s => { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; };
const weekNo = (b, date) => Math.floor((monday(date) - monday(b.settings?.semesterStart || "2026-08-31")) / 6048e5) + 1;
const dow = date => { const g = new Date(date + "T00:00:00").getDay(); return g >= 1 && g <= 5 ? g : 0; };
const stub = (id, icon, title, note) => ({ id, icon, title, summary: async () => null,
  render: el => el.innerHTML = `<h2>${title}</h2><p class="muted">${note}</p>` });
const BOARD0 = { settings: { semesterStart: "2026-08-31" }, events: [], morningTemplates: {}, weeksData: {} };

const home = {
  id: "home", icon: "🏠", title: "首頁", summary: async () => null,
  async render(el) { const p = buildProj(await getKV("board", BOARD0), false); el.append(p); window.__iv = p._iv; }
};
const seatNums = () => seatList().map(r => r.seat);
const DAYS = ["一", "二", "三", "四", "五"];

// ---- 投影頁：乾淨白底 + 可拖曳的小訂正表 ----
function buildProj(b, overlay) {
  const d = dow(today()), day = d ? (b.weeksData?.[weekNo(b, today())]?.[d] || {}) : {};
  const p = document.createElement("div"); p.className = "projw" + (overlay ? " ov" : "");
  p.innerHTML = `<button class="pc" id="pT" style="left:12px;right:auto">＋ 訂正表</button>${overlay ? `<button class="pc" id="pX">✕</button>` : ""}
    <div class="pclk"></div><div class="pdate"></div><div class="pbox">
    <section><h2>早自修任務：</h2><div>${esc(d ? b.morningTemplates?.[d] : "")}</div></section>
    <section><h2>聯絡簿：</h2><div>${esc(day.homework)}</div></section></div>`;
  const clk = () => { const n = new Date();
    p.querySelector(".pclk").textContent = [n.getHours(), n.getMinutes(), n.getSeconds()].map(x => String(x).padStart(2, "0")).join("：");
    p.querySelector(".pdate").textContent = n.toLocaleDateString("zh-TW", { year: "numeric", month: "long", day: "numeric", weekday: "long" }); };
  clk(); const iv = (p._iv = setInterval(clk, 1000));
  p.onclick = e => { if (e.target.id === "pX") { clearInterval(iv); p.remove(); } if (e.target.id === "pT") floatTracker(p, b); };
  return p;
}
const openProj = b => document.body.append(buildProj(b, true));
function bigClock(el) {
  const c = document.createElement("div"); c.className = "bclk";
  const t = () => { const n = new Date(), z = x => String(x).padStart(2, "0");
    c.innerHTML = `<b>${z(n.getHours())}:${z(n.getMinutes())}:${z(n.getSeconds())}</b><small>${n.getFullYear()}.${z(n.getMonth() + 1)}.${z(n.getDate())}</small>`; };
  t(); window.__iv = setInterval(t, 1000); el.prepend(c);
}
function floatTracker(p, b) {
  if (p.querySelector(".ft")) return;
  const tr = (b.tracker ||= { title: "消毒", status: {} }); tr.status ||= {};
  const f = document.createElement("div"); f.className = "ft"; f.style.left = "58%"; f.style.top = "38%";
  const draw = () => f.innerHTML = `<div class="fh"><input id="fT" value="${esc(tr.title)}"><button data-r="1" title="全部重設">↺</button><button data-x="1" title="關閉">✕</button></div>
    <div class="fg">${seatNums().map(s => `<button class="${tr.status[s] ? "d" : ""}" data-s="${s}">${s}</button>`).join("")}</div>`;
  draw(); p.append(f);
  f.onpointerdown = e => { if (!e.target.closest(".fh") || e.target.closest("input,button")) return;
    const ox = e.clientX - f.offsetLeft, oy = e.clientY - f.offsetTop; f.setPointerCapture(e.pointerId);
    f.onpointermove = m => { f.style.left = m.clientX - ox + "px"; f.style.top = m.clientY - oy + "px"; };
    f.onpointerup = () => f.onpointermove = null; };
  f.onclick = async e => { const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.x) return f.remove();
    if (t.dataset.r) tr.status = {}; else if (t.dataset.s) tr.status[t.dataset.s] = !tr.status[t.dataset.s]; else return;
    await setKV("board", b); draw(); };
  f.onchange = async e => { if (e.target.id === "fT") { tr.title = e.target.value; await setKV("board", b); } };
}

// ---- 班級黑板：一頁一週，「作業」欄即當天聯絡簿 ----
const board = {
  id: "board", icon: "📋", title: "行事曆", week: null,
  async summary() {
    const b = await getKV("board", BOARD0), d = dow(today());
    return d && !b.weeksData?.[weekNo(b, today())]?.[d]?.homework ? { text: "今日聯絡簿尚未填寫", badge: "待填寫", go: "board" } : null;
  },
  async render(el) {
    const b = await getKV("board", BOARD0), t0 = today(), F = [["chinese", "國語"], ["math", "數學"], ["flex", "彈性"], ["homework", "作業"]];
    this.week = weekNo(b, t0);
    const draw = () => {
      const wk = this.week, w0 = monday(b.settings?.semesterStart || "2026-08-31");
      const rows = [1, 2, 3, 4, 5].map(d => { const dt = new Date(w0); dt.setDate(dt.getDate() + (wk - 1) * 7 + d - 1);
        const day = b.weeksData?.[wk]?.[d] || {};
        return `<tr class="${ymd(dt) === t0 ? "today" : ""}"><th>${dt.getMonth() + 1}/${dt.getDate()}（${DAYS[d - 1]}）</th>${F.map(([k]) => `<td><textarea data-d="${d}" data-k="${k}">${esc(day[k])}</textarea></td>`).join("")}</tr>`; }).join("");
      el.innerHTML = `<h2>行事曆</h2><div class="bar"><button class="chip" data-w="-1">◀ 上一週</button><b>第 ${wk} 週</b>
        <button class="chip" data-w="1">下一週 ▶</button><button class="chip" data-w="0">本週</button><button class="btn hot" id="bProj">全螢幕投影</button></div>
        <div class="wrap"><table class="wk"><tr><th></th>${F.map(([, n]) => `<th>${n}</th>`).join("")}</tr>${rows}</table></div>
        <p class="muted">「作業」欄會自動成為當天的聯絡簿，輸入後會自動儲存。 <span id="bMsg"></span></p>
        <h3>早自修任務（每週固定，投影時顯示）</h3><div class="bar">${DAYS.map((n, i) => `<label>週${n}<textarea class="s" data-m="${i + 1}">${esc(b.morningTemplates?.[i + 1])}</textarea></label>`).join("")}</div>`;
    };
    el.onclick = e => { const t = e.target.closest("button"); if (!t) return;
      if (t.dataset.w != null) { this.week = +t.dataset.w ? this.week + +t.dataset.w : weekNo(b, t0); draw(); }
      else if (t.id === "bProj") openProj(b); };
    el.onchange = async e => { const t = e.target;
      if (t.dataset.k) { const w = ((b.weeksData ||= {})[this.week] ||= {}); w[t.dataset.d] = { ...(w[t.dataset.d] || {}), [t.dataset.k]: t.value }; }
      else if (t.dataset.m) (b.morningTemplates ||= {})[t.dataset.m] = t.value; else return;
      await setKV("board", b); $("#bMsg").textContent = "已儲存"; };
    draw();
  }
};

// ---- 作業訂正：最多四張，可收合；點座號消除，再點恢復 ----
const COLORS = [["#D3E6DE", "#2F5E4E", "#EDF5F1"], ["#F1D6DD", "#7A3A4A", "#FBF0F3"], ["#EADFC9", "#5C4B2E", "#F7F2E7"], ["#D9E3E7", "#2F4550", "#EEF3F5"]];
const corrections = {
  id: "corrections", icon: "✏️", title: "作業訂正",
  async summary() {
    const c = await getKV("corr2", { tables: [] }), n = seatList().length, open = c.tables.filter(t => t.done.length < n).length;
    return open ? { text: "訂正表尚有座號未完成", badge: `${open} 張`, go: "corrections" } : null;
  },
  async render(el) {
    const c = await getKV("corr2", { tables: [{ id: "1", title: "國習", color: 0, hidden: false, done: [] }] }), nums = seatNums();
    const get = id => c.tables.find(x => x.id === id);
    el.innerHTML = `<div id="cBody"></div>`; bigClock(el);
    const draw = () => { const vis = c.tables.filter(t => !t.hidden), hid = c.tables.filter(t => t.hidden);
      $("#cBody").innerHTML = `<h2>作業訂正</h2><div class="bar">${hid.map(t => `<button class="chip" data-show="${t.id}">展開：${esc(t.title)}</button>`).join("")}
        ${c.tables.length < 4 ? `<button class="btn on" id="cAdd">＋ 新增訂正表</button>` : ""}</div>
        <div class="ctabs n${vis.length}">${vis.map(t => `<section class="ct" style="--h:${COLORS[t.color % 4][0]};--t:${COLORS[t.color % 4][1]};--c:${COLORS[t.color % 4][2]}"><div class="cth">
        <input data-t="${t.id}" value="${esc(t.title)}"><button data-hide="${t.id}">收合</button><button data-rm="${t.id}">刪除</button></div>
        <div class="cg">${nums.map(s => `<button class="${t.done.includes(s) ? "gone" : ""}" data-tb="${t.id}" data-s="${s}">${s}</button>`).join("")}</div></section>`).join("")
        || `<p class="muted">目前沒有展開的訂正表。</p>`}</div>`; };
    el.onclick = async e => { const t = e.target.closest("button"); if (!t) return; const d = t.dataset;
      if (d.s) { const tb = get(d.tb), s = +d.s; tb.done = tb.done.includes(s) ? tb.done.filter(x => x !== s) : [...tb.done, s]; }
      else if (d.hide) get(d.hide).hidden = true; else if (d.show) get(d.show).hidden = false;
      else if (d.rm) { if (!confirm("確定刪除這張訂正表？")) return; c.tables = c.tables.filter(x => x.id !== d.rm); }
      else if (t.id === "cAdd") { const used = c.tables.map(x => x.color);
        c.tables.push({ id: String(Date.now()), title: "新訂正表", color: [0, 1, 2, 3].find(i => !used.includes(i)) ?? 0, hidden: false, done: [] }); }
      else return;
      await setKV("corr2", c); draw(); };
    el.onchange = async e => { if (e.target.dataset.t) { get(e.target.dataset.t).title = e.target.value; await setKV("corr2", c); } };
    draw();
  }
};

// ---- 加分：先選人（可一鍵全選再取消少數），再按加減分；國語依座位表排列 ----
const ST = ["準時", "遲到", "缺席", "公差", "請假"], PERIODS = ["遲到", "早自修", "第1節", "第2節", "第3節", "第4節", "午休", "第5節", "第6節", "第7節"];
const normSt = s => ({ "未到校": "缺席", "公差離班": "公差", "準時到校": "準時", "全勤": "準時" }[s] || s);
const attendance = {
  id: "attendance", icon: "🗓️", title: "出缺勤", date: today(), period: "早自修", summary: async () => null,
  async render(el) {
    const a = await getKV("attendance", {}); a.leaves ||= []; a.attendance ||= {}; a.periodAttendance ||= {};
    const list = seatList(), nums = list.map(r => r.seat), names = Object.fromEntries(list.map(r => [r.seat, r.name]));
    const grid = (a.seatGrid || []).map(Number).filter(n => !isNaN(n)).map(s => nums.includes(s) ? s : 0), cells = grid.length ? grid : nums;
    let tm; const persist = () => { clearTimeout(tm); tm = setTimeout(() => setKV("attendance", a), 700); };
    const leaveOf = (s, d) => a.leaves.find(l => +l.seat === s && d >= l.startDate && d <= l.endDate);
    const stat = s => normSt(a.periodAttendance[this.date]?.[this.period]?.[s]) || (leaveOf(s, this.date) ? "請假" : "準時");
    el.innerHTML = `<div id="aBody"></div>`; bigClock(el);
    const draw = () => {
      const sts = Object.fromEntries(nums.map(s => [s, stat(s)])), cnt = k => nums.filter(s => sts[s] === k);
      const here = nums.length - cnt("缺席").length - cnt("請假").length - cnt("公差").length;
      const ls = a.leaves.filter(l => l.endDate >= today()).sort((x, y) => x.startDate.localeCompare(y.startDate));
      $("#aBody").innerHTML = `<div class="bar"><button class="chip" data-dd="-1">◀</button><b>${this.date}</b><button class="chip" data-dd="1">▶</button><button class="chip" data-dd="0">今天</button></div>
        <div class="bar">${PERIODS.map(p => `<button class="chip ${p === this.period ? "on" : ""}" data-p="${p}">${p}</button>`).join("")}</div>
        <div class="brd">應到 ${nums.length}　實到 ${here}　${ST.slice(1).map(k => cnt(k).length ? `${k}：${cnt(k).map(s => s + " " + (names[s] || "")).join("、")}` : "").filter(Boolean).join("　｜　")}</div>
        <div class="seats" style="grid-template-columns:repeat(6,1fr)">${cells.map(s => s ? `<button class="seat st${ST.indexOf(sts[s])}" data-seat="${s}">${s}<small>${esc(names[s])}</small><b>${sts[s]}</b></button>` : `<span></span>`).join("")}</div>
        <h3>請假登記</h3><div class="bar"><input id="lS" type="number" placeholder="座號" style="width:90px"><input id="lA" type="date" style="width:170px"><input id="lB" type="date" style="width:170px">
        <input id="lR" placeholder="原因（選填）" style="width:200px"><button class="btn on" id="lAdd">新增</button></div>
        ${ls.map(l => `<div class="row"><span>${l.seat} 號 ${esc(names[l.seat])}　${l.startDate}～${l.endDate}　${esc(l.reason || l.type)}</span><button class="chip" data-lr="${l.id}">刪除</button></div>`).join("") || `<p class="muted">目前沒有請假紀錄。</p>`}`;
    };
    el.onclick = e => { const t = e.target.closest("button"); if (!t) return; const d = t.dataset;
      if (d.dd != null) { const dt = new Date(this.date + "T00:00:00"); this.date = +d.dd ? ymd(new Date(dt.setDate(dt.getDate() + +d.dd))) : today(); }
      else if (d.p) this.period = d.p;
      else if (d.seat) { const s = +d.seat, nx = ST[(ST.indexOf(stat(s)) + 1) % 5];
        ((a.periodAttendance[this.date] ||= {})[this.period] ||= {})[s] = nx;
        if (this.period === "早自修") (a.attendance[this.date] ||= {})[s] = nx; persist(); }
      else if (d.lr) { a.leaves = a.leaves.filter(l => l.id !== d.lr); persist(); }
      else if (t.id === "lAdd") { const s = +$("#lS").value, sd = $("#lA").value; if (!s || !sd) return;
        a.leaves.push({ id: String(Date.now()), seat: s, type: "請假", reason: $("#lR").value, startDate: sd, endDate: $("#lB").value || sd }); persist(); }
      else return;
      draw(); };
    draw();
  }
};

const points = {
  id: "points", icon: "⭐", title: "加分系統", subj: "chinese", sel: new Set(), summary: async () => null,
  async render(el) {
    const p = await getKV("points", { studentCount: 28, scores: {} }), att = await getKV("attendance", {});
    const S = [["chinese", "國語"], ["math", "數學"], ["order", "綜合（秩序）"]], list = seatList(p.studentCount), nums = list.map(r => r.seat);
    const PRE = { chinese: [1, 2, 3, -1], math: [1, 2, 3, -1], order: [1, 3, 6, 10, 15, -5, -10] };
    const names = Object.fromEntries(list.map(r => [r.seat, r.name]));
    const grid = (att.seatGrid || []).map(Number).filter(n => !isNaN(n)).map(s => nums.includes(s) ? s : 0);
    const draw = () => { const ch = this.subj === "chinese" && grid.length, cells = ch ? grid : nums;
      el.dataset.sj = this.subj;
      el.innerHTML = `<h2>加分系統</h2><div class="bar">${S.map(([k, n]) => `<button class="chip k-${k} ${k === this.subj ? "on" : ""}" data-sj="${k}">${n}</button>`).join("")}</div>
        <div class="bar"><button class="chip" data-all="1">全選全班</button><button class="chip" data-none="1">清除選取</button><b>已選 ${this.sel.size} 人</b>
        ${PRE[this.subj].map(v => `<button class="btn on" data-ap="${v}" ${this.sel.size ? "" : "disabled"}>${v > 0 ? "＋" : "－"}${Math.abs(v)}</button>`).join("")}</div>
        <div class="seats" style="grid-template-columns:repeat(${ch ? 6 : 10},1fr)">${cells.map(s => s ? `<button class="seat ${this.sel.has(s) ? "sel" : ""}" data-seat="${s}">${s}<small>${esc(names[s])}</small><b>${p.scores[s]?.[this.subj] || 0}</b></button>` : `<span></span>`).join("")}</div>
        <div class="bar"><button class="chip" id="pX">匯出 Excel（CSV）</button><button class="chip" id="pR1">清空當前科目分數</button><button class="chip" id="pR2">重置全部分數</button></div>`; };
    el.onclick = async e => { const t = e.target.closest("button"); if (!t || t.disabled) return; const d = t.dataset;
      if (d.sj) this.subj = d.sj;
      else if (d.all) this.sel = new Set(nums); else if (d.none) this.sel = new Set();
      else if (d.seat) { const s = +d.seat; this.sel.has(s) ? this.sel.delete(s) : this.sel.add(s); }
      else if (d.ap) { for (const s of this.sel) { const o = (p.scores[s] ||= {}); o[this.subj] = (o[this.subj] || 0) + +d.ap; } this.sel = new Set(); await setKV("points", p); }
      else if (t.id === "pX") { const rows = [["座號", "姓名", "國語", "數學", "綜合", "總分"], ...nums.map(s => { const o = p.scores[s] || {}, c = o.chinese || 0, m = o.math || 0, r = o.order || 0; return [s, names[s] || "", c, m, r, c + m + r]; })];
        const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(",")).join("\n")], { type: "text/csv;charset=utf-8" }));
        a.download = `加分登記表_${today()}.csv`; a.click(); return; }
      else if (t.id === "pR1") { if (!confirm("確定清空「" + S.find(x => x[0] === this.subj)[1] + "」的所有分數？")) return; nums.forEach(s => { if (p.scores[s]) p.scores[s][this.subj] = 0; }); await setKV("points", p); }
      else if (t.id === "pR2") { if (!confirm("確定重置全班所有科目的分數？此動作無法復原，建議先匯出。")) return; p.scores = {}; await setKV("points", p); }
      else return;
      draw(); };
    draw();
  }
};

// ---- 資料匯入：三份舊備份各自上傳，另有新系統的完整備份 ----
const IMPORTS = [
  { key: "board", label: "行事曆／聯絡簿備份（教學儀錶板）", ok: d => d.weeksData || d.events,
    pick: d => ({ settings: d.settings, events: d.events, morningTemplates: d.morningTemplates, weeksData: d.weeksData, tracker: d.tracker }) },
  { key: "attendance", label: "出缺勤備份", ok: d => d.students && d.leaves, pick: d => d },
  { key: "points", label: "加分備份", ok: d => d.scores, pick: d => ({ studentCount: d.studentCount, scores: d.scores }) }
];
const data = {
  id: "data", icon: "💾", title: "備份與匯入", summary: async () => null,
  render(el) {
    el.innerHTML = `<h2>備份與匯入</h2>${IMPORTS.map(m => `<div class="card"><h3>${m.label}</h3>
      <input type="file" accept=".json" data-imp="${m.key}"></div>`).join("")}
      <div class="card"><h3>新系統完整備份</h3><p><button class="btn on" id="dOut">下載完整備份</button></p>
      <p class="muted">還原整份備份：</p><input type="file" accept=".json" data-imp="_all"></div><p id="dMsg" class="muted"></p>`;
    el.onchange = async e => {
      const f = e.target.files[0], k = e.target.dataset.imp; if (!f || !k) return;
      try {
        const d = JSON.parse(await f.text()), msg = $("#dMsg");
        if (k === "_all") {
          if (d._format !== "dashboard-v1") throw new Error("這不是新系統的完整備份檔");
          if (!confirm("將覆蓋目前所有資料，確定還原？")) return;
          for (const [n, v] of Object.entries(d.kv)) await setKV(n, v);
          ctx.roster = d.roster || []; ctx.cfg = d.cfg || ctx.cfg;
        } else {
          const m = IMPORTS.find(x => x.key === k);
          if (!m.ok(d)) throw new Error("檔案格式不符，請確認選的是「" + m.label + "」");
          if (!confirm(`將覆蓋目前的「${m.label}」資料，確定匯入？`)) return;
          await setKV(k, m.pick(d));
          if (k === "attendance" && !ctx.roster.length) ctx.roster = d.students.filter(s => s.status !== "轉出").map(s => ({ seat: +s.seat, name: s.name }));
        }
        await saveConfig("roster", { students: ctx.roster }); await saveConfig("main", ctx.cfg); fill();
        msg.textContent = "匯入完成。"; e.target.value = "";
      } catch (err) { $("#dMsg").textContent = "匯入失敗：" + err.message; }
    };
    $("#dOut").onclick = async () => save(`dashboard_backup_${today()}.json`, { _format: "dashboard-v1", kv: await allKV(), roster: ctx.roster, cfg: ctx.cfg });
  }
};

const settings = {
  id: "settings", icon: "⚙️", title: "設定", summary: async () => null,
  render(el) {
    el.innerHTML = `<h2>設定</h2><div class="card"><label>班級名稱<input id="sCls" value="${esc(ctx.cfg.className)}"></label>
      <p>學生名單（每行一位：座號 姓名）</p><textarea id="sRoster">${ctx.roster.map(r => `${r.seat} ${esc(r.name)}`).join("\n")}</textarea>
      <p><button id="sSave" class="btn on">儲存</button> <span id="sMsg" class="muted"></span></p><p><button id="sOut" class="btn">登出</button></p></div>`;
    $("#sSave").onclick = async () => {
      ctx.roster = $("#sRoster").value.split("\n").map(l => l.trim().match(/^(\d+)\s+(.+)$/)).filter(Boolean).map(m => ({ seat: +m[1], name: m[2] })).sort((a, b) => a.seat - b.seat);
      ctx.cfg.className = $("#sCls").value.trim() || ctx.cfg.className;
      await saveConfig("roster", { students: ctx.roster }); await saveConfig("main", ctx.cfg); fill(); $("#sMsg").textContent = "已儲存";
    };
    $("#sOut").onclick = () => logout();
  }
};

const MODS = [home, board, attendance, corrections, points, data, settings];

function fill() { $("#clsName").textContent = ctx.cfg.className; $("#clsInfo").textContent = `${ctx.roster.length} 位學生`; }
function go(id) {
  $("#nav").innerHTML = MODS.map(m => `<button data-go="${m.id}" class="${m.id === id ? "on" : ""}"><span>${m.icon}</span><span class="t">${m.title}</span></button>`).join("");
  clearInterval(window.__iv); const el = $("#view"); el.onclick = el.onchange = null; el.removeAttribute("data-sj"); el.innerHTML = "";
  Promise.resolve(MODS.find(m => m.id === id).render(el)).catch(err => el.innerHTML = `<div class="card"><h2>這一頁載入失敗</h2><p class="muted">${esc(err.message)}</p></div>`);
}
document.addEventListener("click", e => { const g = e.target.closest("[data-go]"); if (g) go(g.dataset.go); });
$("#fold").onclick = () => $("#app").classList.toggle("fold");
$("#signin").onclick = () => login().catch(e => $("#loginMsg").textContent = "登入失敗：" + e.message);
const tick = () => $("#clock").textContent = new Date().toLocaleString("zh-TW", { month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false });
setInterval(tick, 20000); tick();

onUser(async user => {
  $("#login").hidden = !!user; $("#app").hidden = !user; if (!user) return;
  try {
    ctx.cfg = { ...ctx.cfg, ...(await getConfig("main", {})) };
    ctx.roster = (await getConfig("roster", { students: [] })).students;
    fill(); go("home");
  } catch (e) {
    $("#app").hidden = true; $("#login").hidden = false;
    $("#loginMsg").textContent = "此帳號沒有讀取權限，請確認 Firestore 規則中的 Email。"; logout();
  }
});

</script>
</body>
</html>
